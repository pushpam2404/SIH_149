name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # ---- Windows: exercise the same setup script users run ----
      - name: Setup (Windows, scripts/setup_env.ps1)
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\setup_env.ps1

      # ---- Linux / macOS: system packages, then pip ----
      - name: System packages (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y testdisk libmagic1 libegl1 libgl1 libxkbcommon0 \
            libxkbcommon-x11-0 libdbus-1-3 libfontconfig1
      - name: System packages (macOS)
        if: runner.os == 'macOS'
        run: brew install testdisk libmagic
      - name: Python packages (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt

      # ci_report.py prints full output and also publishes the summary as annotations.
      - name: Tests (Windows)
        if: runner.os == 'Windows'
        run: .venv\Scripts\python.exe .github\ci_report.py tests
      - name: Tests (Linux / macOS)
        if: runner.os != 'Windows'
        run: .venv/bin/python .github/ci_report.py tests

      - name: Platform self-check on the real runner (Windows)
        if: runner.os == 'Windows'
        run: .venv\Scripts\python.exe .github\ci_report.py platform
      - name: Platform self-check on the real runner (Linux / macOS)
        if: runner.os != 'Windows'
        run: .venv/bin/python .github/ci_report.py platform

  # Renders every page and dialog with each OS's real display system (not
  # offscreen) and publishes the PNGs to the orphan branch ci-screenshots-<os>,
  # so the UI can be compared across platforms without a GitHub login.
  screenshots:
    name: screenshots ${{ matrix.os }}
    needs: test
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\setup_env.ps1
      - name: Setup (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 \
            libxcb-randr0 libxcb-render-util0 libxcb-image0
          python -m venv .venv && .venv/bin/python -m pip install -r requirements.txt
      - name: Setup (macOS)
        if: runner.os == 'macOS'
        run: python -m venv .venv && .venv/bin/python -m pip install -r requirements.txt
      - name: Render (Windows)
        if: runner.os == 'Windows'
        run: .venv\Scripts\python.exe -m scripts.render_screenshots shots
      - name: Render (Linux, X11 via Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1920x1080x24" .venv/bin/python -m scripts.render_screenshots shots
      - name: Render (macOS)
        if: runner.os == 'macOS'
        run: .venv/bin/python -m scripts.render_screenshots shots
      - name: Publish to branch ci-screenshots-${{ runner.os }}
        shell: bash
        run: |
          cd shots
          git init -q -b main
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .
          git commit -q -m "Screenshots for ${GITHUB_SHA::7} on ${RUNNER_OS}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:ci-screenshots-${RUNNER_OS,,}"
